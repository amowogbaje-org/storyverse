name: Storyverse CI

# PR-safe validation: build both halves of the app and confirm migrations
# run cleanly against a throwaway SQLite DB. Deliberately does NOT run a
# test suite and does NOT deploy anywhere — no SSH keys or production
# secrets are touched here, so it's safe to run on every PR (including
# from forks, if you ever accept those).

on:
  pull_request:

jobs:
  build-and-check-migrations:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: sqlite3, pdo_sqlite

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Composer dependencies
        working-directory: backend
        run: composer install --no-interaction --prefer-dist

      - name: Prepare throwaway environment
        working-directory: backend
        run: |
          cp .env.example .env
          touch database/database.sqlite
          php artisan key:generate
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite

      - name: Run migrations (basic pass — no seeders, no test suite)
        working-directory: backend
        run: php artisan migrate --force
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite

      - name: Build frontend
        working-directory: frontend
        run: |
          npm install
          npm run build
        env:
          VITE_API_URL: https://${{ vars.BACKEND_URL }}/api/v1
          VITE_VAPID_PUBLIC_KEY: ${{ vars.VITE_VAPID_PUBLIC_KEY }}
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
          VITE_SITE_URL: https://${{ vars.FRONTEND_URL }}