name: Deploy fullstack to storyverse.amowogbaje.com

# Only this workflow deploys now - see ci.yml, which has its deploy job
# disabled (backend/frontend still exist in this repo and still have CI
# tests run against them, they just no longer ship anywhere).
on:
  push:
    branches: [main]
    paths:
      - 'fullstack/**'
      - '.github/workflows/deploy-fullstack.yml'
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fullstack
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2

      - name: Install PHP dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: fullstack/package-lock.json

      - name: Install Node dependencies and build assets
        run: |
          npm ci
          npm run build

      # Nothing under fullstack/storage or fullstack/.env exists in this
      # repo (both are gitignored) - this just documents that the rsync
      # below can never touch them even if that ever changes.
      - name: Strip dev-only files before upload
        run: |
          rm -rf node_modules tests .git
          rm -f .env.cpanel.example

      - name: Deploy over SSH (mirrors this build, keeps .env and storage/ untouched)
        uses: burnett01/rsync-deployments@7.0.2
        with:
          switches: >-
            -avzr --delete
            --exclude=".env"
            --exclude="storage/"
            --exclude="public/storage"
          path: fullstack/
          remote_path: ${{ secrets.CPANEL_FULLSTACK_PATH }}
          remote_host: ${{ secrets.CPANEL_HOST }}
          remote_user: ${{ secrets.CPANEL_USER }}
          remote_key: ${{ secrets.CPANEL_SSH_KEY }}
          remote_port: ${{ secrets.CPANEL_SSH_PORT }}

      - name: Run migrations and cache config on the server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.CPANEL_HOST }}
          username: ${{ secrets.CPANEL_USER }}
          key: ${{ secrets.CPANEL_SSH_KEY }}
          port: ${{ secrets.CPANEL_SSH_PORT }}
          script: |
            cd ${{ secrets.CPANEL_FULLSTACK_PATH }}
            php artisan migrate --force
            php artisan storage:link || true
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
