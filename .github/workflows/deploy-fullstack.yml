name: Deploy fullstack to storyverse.amowogbaje.com

on:
push:
branches: [main]
paths:
- 'fullstack/**'
- '.github/workflows/deploy-fullstack.yml'
workflow_dispatch: {}

jobs:
deploy:
runs-on: ubuntu-latest

```
steps:
  - name: Check out the repository
    uses: actions/checkout@v4

  - name: Set up PHP
    uses: shivammathur/setup-php@v2
    with:
      php-version: '8.3'
      tools: composer:v2

  - name: Install PHP dependencies
    working-directory: fullstack
    run: composer install --no-dev --optimize-autoloader --no-interaction

  - name: Set up Node
    uses: actions/setup-node@v4
    with:
      node-version: '22'
      cache: 'npm'
      cache-dependency-path: fullstack/package-lock.json

  - name: Install Node dependencies and build assets
    working-directory: fullstack
    run: |
      npm ci
      npm run build

  - name: Strip dev-only files before upload
    working-directory: fullstack
    run: |
      rm -rf node_modules tests .git
      rm -f .env.cpanel.example

  - name: Deploy application
    env:
      host: ${{ vars.HOST }}
      username: ${{ vars.USER }}
      key: ${{ secrets.SSH_PRIVATE_KEY }}
      port: ${{ vars.PORT }}
      remote_path: ${{ vars.FRONTEND_URL }}
    run: |
      echo "$key" > /tmp/private_key
      chmod 600 /tmp/private_key

      rsync -avz \
        -e "ssh -i /tmp/private_key -o StrictHostKeyChecking=no -p $port" \
        --exclude='.env' \
        --exclude='storage/' \
        --exclude='public/storage' \
        --exclude='.git' \
        --delete \
        fullstack/ \
        "$username@$host:$remote_path"

  - name: Run post-deploy commands on server
    uses: appleboy/ssh-action@v1.0.3
    with:
      host: ${{ vars.HOST }}
      username: ${{ vars.USER }}
      key: ${{ secrets.SSH_PRIVATE_KEY }}
      port: ${{ vars.PORT }}
      script: |
        cd ${{ vars.FRONTEND_URL }}

        # Rebuild Laravel package discovery on the server.
        php artisan package:discover --ansi

        # Clear stale cached configuration and application cache.
        php artisan config:clear
        php artisan cache:clear

        # Run database migrations.
        php artisan migrate --force

        # Rebuild production caches.
        php artisan config:cache
        php artisan route:cache
        php artisan view:cache

        # Ensure storage directories exist.
        mkdir -p storage/app/resumes

        # Create the public storage symlink if needed.
        php artisan storage:link || true
```
