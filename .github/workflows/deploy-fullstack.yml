name: Deploy fullstack to storyverse.amowogbaje.com

on:
  push:
    branches:
      - main
    paths:
      - 'fullstack/**'
      - '.github/workflows/deploy-fullstack.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # --------------------------------------------------
      # Checkout
      # --------------------------------------------------
      - name: Check out the repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # PHP
      # --------------------------------------------------
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2

      - name: Install Composer dependencies
        working-directory: fullstack
        run: |
          composer install \
            --no-dev \
            --optimize-autoloader \
            --no-interaction

      # --------------------------------------------------
      # Node.js
      # --------------------------------------------------
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: fullstack/package-lock.json

      - name: Install Node dependencies and build assets
        working-directory: fullstack
        run: |
          npm ci
          npm run build

      # --------------------------------------------------
      # Remove files that should never be deployed
      # --------------------------------------------------
      - name: Strip dev-only files before upload
        working-directory: fullstack
        run: |
          rm -rf node_modules
          rm -rf tests
          rm -rf .git
          rm -f .env.cpanel.example

      # --------------------------------------------------
      # Deploy using rsync + SSH
      # --------------------------------------------------
      - name: Test SSH connection
        env:
          HOST: ${{ vars.HOST }}
          USERNAME: ${{ vars.USER }}
          PORT: ${{ vars.PORT }}
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          echo "$SSH_KEY" > /tmp/private_key
          chmod 600 /tmp/private_key

          echo "Testing SSH connection..."
          echo "Host: $HOST"
          echo "User: $USERNAME"
          echo "Port: $PORT"

          ssh -vvv \
            -i /tmp/private_key \
            -o StrictHostKeyChecking=no \
            -p "$PORT" \
            "$USERNAME@$HOST" \
            "whoami && hostname && pwd"
      # --------------------------------------------------
      # Run Laravel commands on the production server
      # --------------------------------------------------
      - name: Run post-deploy commands on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.HOST }}
          username: ${{ vars.USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ vars.PORT }}

          script: |
            cd ${{ vars.FRONTEND_URL }}

            # Rebuild Laravel package discovery.
            php artisan package:discover --ansi

            # Clear stale configuration and application cache.
            php artisan config:clear
            php artisan cache:clear

            # Run database migrations.
            php artisan migrate --force

            # Rebuild production caches.
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            # Ensure application storage directories exist.
            mkdir -p storage/app/resumes

            # Create the public storage symlink if it does not exist.
            php artisan storage:link || true