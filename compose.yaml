services:
  # ============================================================================
  # LOCAL DEV ONLY. Nothing in this file is required to deploy Storyverse.
  # - cPanel / bare-metal: see DEPLOYMENT.md - no Docker at all, just PHP + MySQL.
  # - Docker on a cloud VPS: see compose.prod.yaml - a lean 3-service stack
  #   (backend, frontend, one database), no Redis/Meilisearch/Selenium.
  # Everything below (Redis, Meilisearch, Selenium, a standing queue worker and
  # scheduler process) is genuinely optional convenience for local development
  # at a bigger scale than this app needs right now - the app runs fine without
  # any of it (CACHE_STORE/SESSION_DRIVER=file, QUEUE_CONNECTION=sync).
  # ============================================================================

  # ---------- Backend (Laravel API, served directly, no nginx) ----------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
    environment:
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=storyverse
      - DB_USERNAME=storyverse
      - DB_PASSWORD=secret
      - REDIS_HOST=redis
      - MAIL_HOST=mailpit
      - MAIL_PORT=1025
      - MEILISEARCH_HOST=http://meilisearch:7700
    depends_on:
      - postgres
      - redis
      - mailpit
      - meilisearch
    networks:
      - storyverse

  queue:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: php artisan queue:work --tries=3
    volumes:
      - ./backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
    environment:
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=storyverse
      - DB_USERNAME=storyverse
      - DB_PASSWORD=secret
      - REDIS_HOST=redis
      - MAIL_HOST=mailpit
      - MAIL_PORT=1025
      - MEILISEARCH_HOST=http://meilisearch:7700
    depends_on:
      - postgres
      - redis
      - backend
    networks:
      - storyverse

  scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: php artisan schedule:work
    volumes:
      - ./backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
    environment:
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=storyverse
      - DB_USERNAME=storyverse
      - DB_PASSWORD=secret
      - REDIS_HOST=redis
      - MAIL_HOST=mailpit
      - MAIL_PORT=1025
    depends_on:
      - postgres
      - redis
      - backend
    networks:
      - storyverse

  # ---------- Frontend (React + Vite) ----------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000/api/v1
      # Optional: set GOOGLE_CLIENT_ID in your shell env (or backend/.env, then
      # `export $(grep GOOGLE_CLIENT_ID backend/.env)`) before `docker compose up`
      # to enable the Google Sign-In button. Safe to leave unset - it just
      # defaults to blank and the button stays hidden.
      - VITE_GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      # Push notifications: same value as VAPID_PUBLIC_KEY in backend/.env - it's
      # the "public" half of the pair, meant to ship to the browser. Leave unset
      # and the push-notification toggle just won't render (isPushSupported()).
      - VITE_VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY:-}
    depends_on:
      - backend
    networks:
      - storyverse

  # ---------- Data / infra ----------
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=storyverse
      - POSTGRES_USER=storyverse
      - POSTGRES_PASSWORD=secret
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - storyverse

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - storyverse

  mailpit:
    image: axllent/mailpit
    ports:
      - "8025:8025"   # web UI
      - "1025:1025"   # smtp
    networks:
      - storyverse

  meilisearch:
    image: getmeili/meilisearch:v1.9
    ports:
      - "7700:7700"
    environment:
      - MEILI_MASTER_KEY=storyverse_master_key
      - MEILI_ENV=development
    volumes:
      - meili_data:/meili_data
    networks:
      - storyverse

  adminer:
    image: adminer
    ports:
      - "8081:8080"
    environment:
      - ADMINER_DEFAULT_SERVER=postgres
    depends_on:
      - postgres
    networks:
      - storyverse

  selenium:
    image: selenium/standalone-chrome:latest
    ports:
      - "4444:4444"   # webdriver
      - "7900:7900"   # noVNC viewer (watch the browser)
    shm_size: 2gb
    networks:
      - storyverse

networks:
  storyverse:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  meili_data:
  backend_vendor:
